<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="620" viewBox="0 0 1180 620">
  <title>Closed member relay: independent promoted legs and explicit close</title>
  <desc>
    Device A and Device B independently discover, authenticate, and promote one
    leg; Device B and Device C do the same. A then sends Open, B sends Offer,
    and C sends Accept. B forwards opaque ciphertext through bounded queues.
    Close follows A-to-B-to-C-to-B-to-A acknowledgement through the exact
    allocation generation; the terminal tombstone prevents successor impact.
  </desc>
  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L10,3 L0,6 z" fill="#245a9b"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L10,3 L0,6 z" fill="#247a45"/>
    </marker>
    <marker id="arrow-gray" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L10,3 L0,6 z" fill="#555"/>
    </marker>
    <style>
      .title { font: 700 22px Helvetica, Arial, sans-serif; fill: #222; }
      .node-title { font: 700 16px Helvetica, Arial, sans-serif; fill: #222; }
      .node-copy { font: 12px Helvetica, Arial, sans-serif; fill: #333; }
      .label { font: 12px Helvetica, Arial, sans-serif; fill: #222; }
      .small { font: 11px Helvetica, Arial, sans-serif; fill: #333; }
      .control { stroke: #245a9b; stroke-width: 2; fill: none; marker-end: url(#arrow-blue); }
      .data { stroke: #247a45; stroke-width: 2; fill: none; marker-end: url(#arrow-green); }
      .close { stroke: #555; stroke-width: 1.8; stroke-dasharray: 7 4; fill: none; marker-end: url(#arrow-gray); }
    </style>
  </defs>

  <rect width="1180" height="620" fill="#fff"/>
  <text x="590" y="36" text-anchor="middle" class="title">Closed member relay: independent promoted legs and explicit close</text>

  <rect x="55" y="112" width="240" height="92" rx="12" fill="#eef5ff" stroke="#333"/>
  <text x="175" y="143" text-anchor="middle" class="node-title">Device A</text>
  <text x="175" y="164" text-anchor="middle" class="node-copy">requester endpoint</text>
  <text x="175" y="183" text-anchor="middle" class="node-copy">holds endpoint crypto</text>

  <rect x="470" y="96" width="240" height="124" rx="12" fill="#eefaf0" stroke="#333"/>
  <text x="590" y="130" text-anchor="middle" class="node-title">Device B</text>
  <text x="590" y="151" text-anchor="middle" class="node-copy">visible Closed member relay</text>
  <text x="590" y="172" text-anchor="middle" class="node-copy">local canonical identity</text>
  <text x="590" y="193" text-anchor="middle" class="node-copy">opaque forwarding only</text>

  <rect x="885" y="112" width="240" height="92" rx="12" fill="#eef5ff" stroke="#333"/>
  <text x="1005" y="143" text-anchor="middle" class="node-title">Device C</text>
  <text x="1005" y="164" text-anchor="middle" class="node-copy">target endpoint</text>
  <text x="1005" y="183" text-anchor="middle" class="node-copy">holds endpoint crypto</text>

  <path d="M295 130 C350 92 415 92 470 130" class="control"/>
  <path d="M470 185 C415 223 350 223 295 185" class="control"/>
  <text x="382" y="78" text-anchor="middle" class="label">independent discovery + endpoint auth</text>
  <text x="382" y="94" text-anchor="middle" class="small">A-B promoted leg</text>

  <path d="M710 130 C765 92 830 92 885 130" class="control"/>
  <path d="M885 185 C830 223 765 223 710 185" class="control"/>
  <text x="798" y="78" text-anchor="middle" class="label">independent discovery + endpoint auth</text>
  <text x="798" y="94" text-anchor="middle" class="small">B-C promoted leg</text>

  <rect x="82" y="270" width="1016" height="150" rx="14" fill="#f8fbff" stroke="#245a9b"/>
  <text x="590" y="297" text-anchor="middle" class="node-title">Exact route-bound control sequence</text>
  <text x="590" y="326" text-anchor="middle" class="label">A &#x2192; B: Open</text>
  <text x="590" y="347" text-anchor="middle" class="label">B &#x2192; C: Offer (requester share)</text>
  <text x="590" y="368" text-anchor="middle" class="label">C &#x2192; B: Accept (target share)</text>
  <text x="590" y="389" text-anchor="middle" class="label">Every message binds context, requester, relay, target, and session</text>
  <text x="590" y="406" text-anchor="middle" class="small">Validated before state mutation or forwarding</text>

  <path d="M175 204 L175 270" class="control"/>
  <path d="M1005 204 L1005 270" class="control"/>
  <path d="M590 220 L590 270" class="control"/>

  <rect x="150" y="470" width="880" height="105" rx="14" fill="#eefaf0" stroke="#247a45"/>
  <text x="590" y="496" text-anchor="middle" class="node-title">Endpoint-only opaque session over the two promoted legs</text>
  <text x="590" y="519" text-anchor="middle" class="label">Signed ephemeral X25519 &#x2192; HKDF-SHA256 &#x2192; AES-256-GCM</text>
  <text x="590" y="540" text-anchor="middle" class="label">A &#x2194; C ciphertext through B's provider-backed bounded two-direction queues</text>
  <text x="590" y="560" text-anchor="middle" class="small">B sees metadata and opaque packets, not endpoint keys or plaintext</text>

  <path d="M295 204 C340 310 250 405 245 470" class="data"/>
  <path d="M885 204 C840 310 930 405 935 470" class="data"/>
  <text x="235" y="355" text-anchor="middle" class="small">opaque data</text>
  <text x="945" y="355" text-anchor="middle" class="small">opaque data</text>

  <path d="M1030 520 C1100 480 1100 445 1025 420" class="close"/>
  <path d="M150 520 C80 480 80 445 155 420" class="close"/>
  <text x="1090" y="474" text-anchor="middle" class="small">Close / ack through B</text>
  <text x="90" y="474" text-anchor="middle" class="small">exact settle / tombstone</text>
  <text x="590" y="605" text-anchor="middle" class="small">Generation and route fences reject stale successors; terminal tombstones make duplicate Close idempotent; shutdown wakes and settles all bounded custody.</text>
</svg>
