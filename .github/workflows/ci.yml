name: CI

on:
  push:
    branches: [main, "claude/**", "arc/**"]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: check / ${{ matrix.platform.name }}
    runs-on: ${{ matrix.platform.os }}
    # -D warnings is scoped to this job on purpose: setting RUSTFLAGS at the
    # workflow level would override (not merge with) the per-target rustflags in
    # .cargo/config.toml, dropping the appliance cross-builds' +crt-static and
    # -u getrandom guard. The daemon-cross job below must inherit those instead.
    env:
      RUSTFLAGS: "-D warnings"
    strategy:
      fail-fast: false
      matrix:
        platform:
          - { name: linux-x86_64,   os: ubuntu-22.04 }
          - { name: macos-aarch64,  os: macos-14 }
          - { name: windows-x86_64, os: windows-latest }
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cargo cache
        uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests
        run: cargo test --workspace --no-fail-fast

      # `--workspace` above runs default features only, so the transport-lab
      # controls never compile there. One suite-wide run with the lab feature
      # covers them. `transport-lab` is now the only optional feature in the
      # workspace, so this is the whole non-default surface.
      - name: Suite-wide transport-lab tests
        run: cargo test -p myownmesh-core --features "transport-lab" --no-fail-fast

  boundaries-and-native:
    name: Compile-fail boundaries and native connector controls
    runs-on: ubuntu-22.04
    env:
      RUSTFLAGS: "-D warnings"
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          key: boundaries-and-native

      - name: Prefetch locked dependencies for the offline boundary harnesses
        run: cargo fetch --locked

      - name: Reject deprecated use from normal V4 source
        run: |
          RUSTFLAGS="-D warnings -D deprecated" cargo check -p myownmesh-core --all-targets
          RUSTFLAGS="-D warnings -D deprecated" cargo check -p myownmesh --all-targets

      # Both compile-fail probe harnesses, side by side. These are what carry
      # the negative boundary claims: each probe is an external crate that must
      # fail to compile for the exact stated cause. Rust visibility, private
      # constructors, and ordinary type checking carry the rest.
      - name: Compiler boundary controls
        run: |
          python3 scripts/check-v4-arc03-compiler-boundaries.py
          python3 scripts/check-v4-arc04-compiler-boundaries.py

      # A representative native set, not a census: connector cleanup ownership,
      # endpoint-driven replacement, and the close fence. These open real peer
      # connections and are `#[ignore]`d, so the suite-wide run in `check` does
      # not reach them; the rest of the connector suite does run there.
      - name: Native connector lifecycle controls
        run: |
          set -euo pipefail
          # Same non-vacuity parse as the Arc 04 steps below, for the same
          # reason: `cargo test` exits 0 when a filter matches nothing, so a
          # renamed or deleted control would pass here silently and naming it
          # would buy nothing. Each run must show exactly one test selected,
          # that exact name reporting ok, and a 1 passed / 0 failed / 0 ignored
          # summary.
          #
          # The tradeoff: this step used to pass `--nocapture` for readable
          # native-connector output. `--nocapture` interleaves test stdout with
          # the `test <name> ... ok` line, so that line can no longer be matched
          # reliably -- and these controls are chatty. A parse that can be
          # defeated by the output it reads is worth less than the log, so the
          # parse wins and a failing control is diagnosed by re-running it
          # locally. `--lib` keeps the run to one target so "running 1 test"
          # means one test, not one of several per-target blocks.
          run_exact_control() {
            name="$1"
            shift
            log="$(mktemp)"
            cargo test -p myownmesh-core --lib --features "transport-lab" \
              "$name" -- --test-threads=1 "$@" | tee "$log"
            grep -qx 'running 1 test' "$log" || {
              echo "non-vacuity failure: '$name' selected no test, or more than one" >&2
              exit 1
            }
            grep -qE "^test ([^[:space:]]*::)?${name} \.\.\. ok\$" "$log" || {
              echo "non-vacuity failure: '$name' did not report ok under that exact name" >&2
              exit 1
            }
            grep -qE '^test result: ok\. 1 passed; 0 failed; 0 ignored' "$log" || {
              echo "non-vacuity failure: '$name' summary was not 1 passed / 0 failed / 0 ignored" >&2
              exit 1
            }
          }

          for control in \
            v4_arc03_cancelled_construction_closes_partial_native_peer \
            v4_arc03j_native_local_ice_restart_commits_exact_replacement \
            v4_arc03g_close_fence_rejects_endpoint_send \
            v4_arc03_realtime_unit_requires_a_live_session_binding_table
          do
            run_exact_control "$control" --ignored
          done

      - name: Direct and TURN endpoint controls
        run: |
          set -euo pipefail
          # Parsed for non-vacuity like the steps above, and for the same
          # reason: `cargo test` exits 0 when a filter matches nothing, so a
          # renamed or deleted control would pass here silently.
          #
          # These two name the same behaviour over two ICE paths -- a direct
          # in-process handshake and one that a real TURN server relayed -- so
          # they live in different packages and target shapes. The helper
          # therefore takes the selector arguments from the caller and keeps
          # only what must not vary: the filter is the control's exact name,
          # the harness runs single-threaded, and the three assertions are
          # fixed. Neither control is `#[ignore]`d, so neither is selected with
          # `--ignored` and `0 ignored` is a real assertion rather than an
          # artefact of the flag.
          #
          # `--nocapture` is dropped here as elsewhere: it interleaves test
          # stdout into the `test <name> ... ok` line these assertions match,
          # and the TURN control in particular prints timing lines under
          # MYOWNMESH_ARC03_OBSERVE_RAW. Reliable parsing is worth more than CI
          # log detail; re-run locally with `--nocapture` to diagnose.
          run_exact_control() {
            name="$1"
            shift
            log="$(mktemp)"
            cargo test "$@" "$name" -- --test-threads=1 | tee "$log"
            grep -qx 'running 1 test' "$log" || {
              echo "non-vacuity failure: '$name' selected no test, or more than one" >&2
              exit 1
            }
            grep -qE "^test ([^[:space:]]*::)?${name} \.\.\. ok\$" "$log" || {
              echo "non-vacuity failure: '$name' did not report ok under that exact name" >&2
              exit 1
            }
            grep -qE '^test result: ok\. 1 passed; 0 failed; 0 ignored' "$log" || {
              echo "non-vacuity failure: '$name' summary was not 1 passed / 0 failed / 0 ignored" >&2
              exit 1
            }
          }

          run_exact_control loopback_handshake_opens_data_channel \
            -p myownmesh-core --lib --features "transport-lab"
          run_exact_control turn_selected_session_authenticates_endpoints_before_bidirectional_data \
            -p myownmesh-services --test turn_webrtc_endpoint_auth

  # Endpoint authentication is basal V4 behaviour, so a small representative set
  # of its controls is named explicitly and parsed for non-vacuity: a control
  # that is renamed or deleted fails here rather than passing silently, which a
  # suite-wide run cannot catch. The behavioural coverage itself lives in the
  # suite-wide runs in `check`.
  arc04-endpoint-auth:
    name: Arc 04 basal endpoint authentication
    runs-on: ubuntu-22.04
    env:
      RUSTFLAGS: "-D warnings"
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          key: arc04-endpoint-auth

      - name: Prefetch locked dependencies for the offline boundary harness
        # The boundary harness builds its probes with `--offline`, so every
        # crate it needs must already be in the local registry. `--locked`
        # keeps that population faithful to Cargo.lock: it fails rather than
        # resolving a different graph, so the harness cannot silently probe
        # against dependencies the lockfile does not pin. This step only
        # populates the cache; it does not relax the harness's offline mode.
        run: cargo fetch --locked

      - name: Arc 04 basal endpoint-auth controls (transport-lab only)
        run: |
          set -euo pipefail
          # `cargo test` exits 0 when a filter matches nothing, so a renamed or
          # deleted control would pass here silently and this whole step would
          # be decorative. Every run is therefore parsed for three facts:
          # exactly one test was selected, that exact name reported ok, and the
          # summary is one passed with nothing failed and nothing ignored.
          #
          # `--nocapture` is deliberately not used: it interleaves test stdout
          # into the `test <name> ... ok` line, which would make that parse
          # unreliable. Every parsed step in this file makes the same trade, so
          # a failing control is diagnosed by re-running it locally with
          # `--nocapture` rather than by reading CI output.
          #
          # The helper is repeated verbatim in each parsed step because every
          # `run:` block is its own shell. Extracting it would mean a script
          # file, and a shared file that drifts is worse than a duplicate that
          # cannot.
          run_exact_control() {
            name="$1"
            shift
            log="$(mktemp)"
            cargo test -p myownmesh-core --lib --features "transport-lab" \
              "$name" -- --test-threads=1 "$@" | tee "$log"
            grep -qx 'running 1 test' "$log" || {
              echo "non-vacuity failure: '$name' selected no test, or more than one" >&2
              exit 1
            }
            grep -qE "^test ([^[:space:]]*::)?${name} \.\.\. ok\$" "$log" || {
              echo "non-vacuity failure: '$name' did not report ok under that exact name" >&2
              exit 1
            }
            grep -qE '^test result: ok\. 1 passed; 0 failed; 0 ignored' "$log" || {
              echo "non-vacuity failure: '$name' summary was not 1 passed / 0 failed / 0 ignored" >&2
              exit 1
            }
          }

          # The named controls carry two different weights. For the ordinary
          # ones the suite-wide transport-lab run in `check` already executes
          # them, so naming them here adds only the rename-or-delete catch a
          # suite-wide run passes silently. For the `#[ignore]`d ones -- which
          # is nearly all of them -- this step is also the run: the suite-wide
          # job never reaches them at all, so deleting a name here deletes its
          # execution.
          #
          # Session admission on a real connector: an admitted peer delivers
          # exactly one accounted unit, and a realtime open without both the
          # capability and the policy is refused. The positive runs first, so
          # the refusal cannot pass merely because the fixture never delivers
          # anything at all. Both open a local WebRTC object and are therefore
          # `#[ignore]`d, which is why they are selected with `--ignored`.
          for control in \
            v4_arc04c_admitted_peer_delivers_exactly_one_accounted_unit \
            v4_arc04c_realtime_without_capability_or_policy_is_refused
          do
            run_exact_control "$control" --ignored
          done

          # The realtime close that returns the connected claim. It opens no
          # native object, so it is the one control in this step that runs in
          # the ordinary set. The captured-peer replacement control used to sit
          # beside it and has moved into the `e1` group below: its arrangement
          # now installs two real connectors, so it carries `#[ignore]` like its
          # siblings and would select nothing here. It is named in exactly one
          # place, so it executes once.
          run_exact_control v4_arc04_promoted_capability_retains_the_connected_claim_until_native_close

          # ---- Promoted-session controls, executed as groups -----------------
          #
          # Four families, four cargo invocations. Naming each control
          # separately would be one compile-and-link of the same test binary
          # per control for no extra guarantee, and the controlling review
          # asked specifically not to grow dozens of one-test invocations. The
          # controls that share no family prefix stay singletons below; the
          # rest fall into four families that can be selected by prefix and
          # then checked name by name.
          #
          # No grand total is stated here, on purpose. The per-family counts
          # below are asserted by `run_exact_group`, so one that drifts fails
          # this step and is corrected by the same failure; a total in a
          # comment is checked by nothing, which is how the previous one came
          # to be wrong.
          #
          # The group assertion is the same claim as the singleton one, made
          # once per family: the run selected exactly the expected number of
          # tests, every expected name reported ok, and the summary is all
          # passed with nothing failed or ignored. Asserting the count *and*
          # each name matters in both directions -- the count catches a control
          # added to the family without being listed here, and the names catch
          # one renamed out of it.
          run_exact_group() {
            prefix="$1"
            expected="$2"
            shift 2
            log="$(mktemp)"
            cargo test -p myownmesh-core --lib --features "transport-lab" \
              "$prefix" -- --test-threads=1 --ignored | tee "$log"
            grep -qx "running $expected tests" "$log" || {
              echo "non-vacuity failure: '$prefix' did not select exactly $expected tests" >&2
              exit 1
            }
            for name in "$@"; do
              grep -qE "^test ([^[:space:]]*::)?${name} \.\.\. ok\$" "$log" || {
                echo "non-vacuity failure: '$name' did not report ok under that exact name" >&2
                exit 1
              }
            done
            grep -qE "^test result: ok\. $expected passed; 0 failed; 0 ignored" "$log" || {
              echo "non-vacuity failure: '$prefix' summary was not $expected passed / 0 failed / 0 ignored" >&2
              exit 1
            }
          }

          # Ordinary-test twin of `run_exact_group`. The ignored families use
          # the helper above because this step is their only execution; these
          # families already run in the suite-wide job, and are named here so a
          # rename or deletion cannot turn that broad run into a silent green.
          run_exact_ordinary_group() {
            prefix="$1"
            expected="$2"
            shift 2
            log="$(mktemp)"
            cargo test -p myownmesh-core --lib --features "transport-lab" \
              "$prefix" -- --test-threads=1 | tee "$log"
            grep -qx "running $expected tests" "$log" || {
              echo "non-vacuity failure: '$prefix' did not select exactly $expected ordinary tests" >&2
              exit 1
            }
            for name in "$@"; do
              grep -qE "^test ([^[:space:]]*::)?${name} \.\.\. ok\$" "$log" || {
                echo "non-vacuity failure: '$name' did not report ok under that exact name" >&2
                exit 1
              }
            done
            grep -qE "^test result: ok\. $expected passed; 0 failed; 0 ignored" "$log" || {
              echo "non-vacuity failure: '$prefix' summary was not $expected passed / 0 failed / 0 ignored" >&2
              exit 1
            }
          }

          # The ones that carry no family prefix.
          run_exact_control admission_gate_admits_application_traffic_from_active_peer --ignored
          run_exact_control v4_arc03_outbound_application_send_requires_current_session_admission --ignored

          # The admission gate's other half: an unauthenticated peer's handshake
          # frame is carried rather than gated, so the handshake can complete at
          # all. It needs a live connector worker to reserve its parse work, so
          # it opens a native object and is `#[cfg(feature = "transport-lab")]`
          # and `#[ignore]`d like its neighbours -- which makes this line its
          # only execution anywhere in CI.
          run_exact_control admission_gate_lets_protocol_frames_through_while_handshaking --ignored

          # Revocation of a *retained* admission. The controls above prove a
          # session is refused when it was never admitted; this one proves an
          # already-promoted session stops authorizing once policy is revoked,
          # and stays refused when policy is restored. It is
          # `#[cfg(feature = "transport-lab")]` and `#[ignore]`d, so neither the
          # default workspace run nor the suite-wide transport-lab run ever
          # reaches it: this line is its only execution anywhere in CI.
          run_exact_control v4_arc05_revoking_policy_refuses_the_next_operation_and_drops_the_session --ignored

          # Inbound application effects against a replaced installation.
          run_exact_group v4_arc04e1_ 5 \
            v4_arc04e1_admitted_inbound_effect_lands_on_the_captured_installation \
            v4_arc04e1_inbound_application_effect_never_reaches_a_replacement \
            v4_arc04e1_captured_peer_effect_is_refused_after_replacement \
            v4_arc04e1_inbound_delivery_is_never_attributed_to_a_replacement \
            v4_arc04e1_stale_owner_application_frame_credits_the_replacement_nothing

          # Who may settle a pending call. The last one is the negative that
          # gives the family its point: a replacement connector for a
          # *different* device still never settles.
          #
          # This prefix is not unique to the engine module -- `rpc.rs` has two
          # `v4_arc04f2_` request-id collision controls. They are ordinary
          # tests, so `--ignored` excludes them and the count is 6. If either
          # ever gains `#[ignore]`, this selects 8 and fails here, which is the
          # right way for that to surface.
          run_exact_group v4_arc04f2_ 6 \
            v4_arc04f2_a_foreign_peer_cannot_settle_another_peers_pending_call \
            v4_arc04f2_a_single_response_cannot_settle_a_pending_stream \
            v4_arc04f2_a_stream_end_cannot_settle_a_pending_single_call \
            v4_arc04f2_a_stream_chunk_from_a_foreign_device_is_ignored \
            v4_arc04f2_same_device_replacement_retires_old_and_fresh_session_settles \
            v4_arc04f2_a_replacement_connector_for_a_different_device_still_never_settles

          # Session-owned retention: the reliable frames and the capability
          # advertisement a promoted session holds, and what happens to them
          # when that session ends or its provider refuses.
          #
          # The `v4_macro1_` prefix is heavily shared -- `transport/webrtc.rs`,
          # `provider.rs` and `session_flow.rs` hold about twenty-five more --
          # but all of those are ordinary tests, so `--ignored` excludes them
          # and the count is 7. If any of them ever gains `#[ignore]`, this
          # selects more than 7 and fails here, which is the right way for that
          # to surface.
          #
          # `v4_macro1_reliable_submission_without_a_session_is_refused_and_retains_nothing`
          # is deliberately absent: it carries no `#[ignore]`, so the suite-wide
          # transport-lab run in `check` already executes it, and naming it here
          # would make this group select 8 and fail. It is the negative these
          # seven positives are read against.
          run_exact_group v4_macro1_ 7 \
            v4_macro1_ending_a_session_releases_its_retained_frames_and_resolves_their_callers \
            v4_macro1_retention_pressure_refuses_the_next_frame_and_releases_exactly_on_ack \
            v4_macro1_capability_metadata_is_owned_by_the_session_that_receives_it \
            v4_macro1_acknowledgement_settles_only_the_sent_contiguous_prefix \
            v4_macro1_an_inbound_gap_neither_delivers_nor_advances \
            v4_macro1_a_second_stream_cannot_reset_the_inbound_mark \
            v4_macro1_a_duplicate_is_reacknowledged_without_a_second_delivery

          # The outbound half of the same boundary: an advertisement made before
          # the peer existed reaches that peer's first session. Named outside the
          # `v4_macro1_` family on purpose -- adding it there would make the group
          # above select 8 and fail -- and run as its own exact control so the
          # count stays a statement about session-owned retention.
          run_exact_control v4_f4_a_new_session_receives_the_advert_made_before_the_peer_existed --ignored

          # The deferred half: a promotion the provider refuses announces nothing,
          # and the first later promotion that succeeds announces exactly once. It
          # measures the real pool rather than faking the refusal, so it is
          # `transport-lab` like the group above and runs only from here.
          run_exact_control v4_f4_a_refused_promotion_announces_nothing_and_the_later_one_announces_once --ignored

          # Retained-record accounting and atomic method registration. These
          # are ordinary controls, so the family helper intentionally omits
          # `--ignored` and asserts both the count and every exact name.
          run_exact_ordinary_group v4_f1_ 4 \
            v4_f1_a_pending_claim_covers_both_request_id_copies_and_the_peer_name \
            v4_f1_b_settling_one_pending_operation_releases_exactly_one_short_operation \
            v4_f1_c_pop_first_drains_owned_records_without_a_key_snapshot \
            v4_f1_d_pop_first_where_preserves_every_unmatched_funded_record

          run_exact_ordinary_group v4_f2_core_ 2 \
            v4_f2_core_a_subscribe_installs_exactly_one_channel_and_one_subscriber \
            v4_f2_core_a_refused_subscribe_leaves_no_channel_no_subscriber_and_no_lease

          # Review 4928180106: exact planning, borrowed ordered traversal and
          # shared-allocation funding controls. Qualify the shared
          # `v4_r3_core_` prefix by module so the two ignored handler-start
          # controls do not enter these ordinary counts.
          run_exact_ordinary_group config::tests::v4_r3_core_ 4 \
            v4_r3_core_the_planning_floor_covers_a_defaulted_config \
            v4_r3_core_an_empty_object_is_priced_for_what_it_becomes \
            v4_r3_core_the_plan_covers_many_minimally_specified_networks \
            v4_r3_core_the_plan_covers_every_populated_repeatable_family
          run_exact_ordinary_group resource::map::tests::v4_r3_core_ 2 \
            v4_r3_core_the_ordered_cursor_answers_the_exact_lower_bound \
            v4_r3_core_an_ordered_pass_walks_one_descent_per_step
          run_exact_ordinary_group resource::provider::tests::v4_r3_core_ 2 \
            v4_r3_core_one_claim_funds_a_shared_allocation_until_its_last_handle \
            v4_r3_core_a_speculative_lease_is_refused_for_sharing_and_keeps_its_funding
          run_exact_ordinary_group identity::tests::v4_r3_core_f7_ 6 \
            v4_r3_core_f7_a_refused_network_id_plan_builds_nothing \
            v4_r3_core_f7_a_funded_network_id_commit_spends_exactly_its_plan \
            v4_r3_core_f7_a_network_id_plan_measures_what_it_will_build \
            v4_r3_core_f7_the_funded_and_unfunded_network_id_rules_are_one_rule \
            v4_r3_core_f7_display_id_length_is_exact_without_building_it \
            v4_r3_core_f7_the_inline_and_owned_display_suffixes_are_one_suffix
          run_exact_ordinary_group engine::peer_snapshot::peers_snapshot_controls::v4_r3_core_f7_ 8 \
            v4_r3_core_f7_a_funded_peers_commit_spends_exactly_its_plan \
            v4_r3_core_f7_a_peers_commit_refuses_a_lease_it_did_not_plan \
            v4_r3_core_f7_a_same_size_replacement_voids_the_whole_snapshot \
            v4_r3_core_f7_a_changed_peer_voids_the_whole_snapshot \
            v4_r3_core_f7_a_raw_advert_copy_keeps_its_bytes_and_its_capacity \
            v4_r3_core_f7_the_funded_peer_row_is_the_unfunded_one_on_the_wire \
            v4_r3_core_f7_the_row_ceiling_covers_the_widest_fixed_row \
            v4_r3_core_f7_a_line_wider_than_admitted_is_refused_before_publication
          run_exact_control borrowed_channel_seq_encodes_exactly_like_the_variant
          run_exact_control v4_arc03f_realtime_bytes_follow_the_payload_owner_through_downstream_queues

          run_exact_ordinary_group v4_f3_ 3 \
            v4_f3_stale_channel_and_rpc_handles_cannot_repopulate_a_closed_gateway \
            v4_f3_a_registration_prepared_before_close_refuses_to_commit_after_it \
            v4_f3_b_a_refused_callback_publishes_neither_half

          # Handler-task admission, clone-owned retention and funded fanout.
          # The `c` and `d` prefixes each deliberately contain two controls:
          # one integration/lifecycle control and one exact ledger control.
          run_exact_control v4_f4_a_borrowed_request_measurement_matches_the_copy_it_refuses_to_make
          run_exact_control v4_f4_b_a_handler_task_is_charged_for_both_request_id_copies
          run_exact_ordinary_group v4_f4_c_ 2 \
            v4_f4_c_live_invocation_clone_retains_the_handler_entry_charge_until_drop \
            v4_f4_c_an_invocation_clone_outlives_forget_replacement_and_close
          run_exact_ordinary_group v4_f4_d_ 2 \
            v4_f4_d_repeated_advertisement_creates_no_unaccounted_task \
            v4_f4_d_fanout_pressure_and_delivery_release_are_exact
          run_exact_control v4_f4_e_revocation_cancels_a_blocked_handler_before_its_post_barrier_effect --ignored

          # Every terminal failure retires the exact captured session, and the
          # last two controls promote a successor inside the retirement window
          # so a device-keyed implementation cannot false-green.
          run_exact_group v4_f5_ 6 \
            v4_f5_a_a_resource_refused_rpc_response_retires_only_the_session_that_sent_it \
            v4_f5_b_an_undecodable_frame_retires_only_the_session_that_delivered_it \
            v4_f5_c_a_resource_refused_reliable_frame_retires_only_the_session_that_sent_it \
            v4_f5_d_an_unadmittable_acknowledgement_retires_only_the_session_that_sent_it \
            v4_f5_e_a_successor_promoted_inside_the_retirement_window_survives_it \
            v4_f5_f_a_successor_promoted_inside_the_reliable_retirement_window_survives_it

          # Review 4923134324: construct pending RPC effects only after their
          # exact session funded them, and derive the stored class from the
          # sealed constructor that builds the effect. These ordinary controls
          # deliberately have no `v4_f3_` prefix: that older family has an
          # independently frozen count of three, so exact singleton selectors
          # keep both rename contracts honest.
          run_exact_control a_refused_filing_never_builds_its_effect
          run_exact_control a_filed_operation_is_stored_as_the_class_it_was_funded_as

          # Review 4923134324: only best-effort channel traffic may disappear
          # under local pressure. The bounded leading-tag policy is ordinary;
          # the three end-to-end session controls open native WebRTC objects
          # and therefore run explicitly from the isolated ignored lane.
          run_exact_control only_the_best_effort_channel_frame_is_droppable
          run_exact_control channel_backpressure_keeps_the_exact_session_it_refused --ignored
          run_exact_control a_stream_chunk_this_side_cannot_carry_ends_the_producers_session --ignored
          run_exact_control receiver_chunk_pressure_ends_the_remote_producer --ignored

          # Reviews 4923134324 and 4928180106: handler revocation is fenced at
          # the synchronous start and encloses the first future poll plus every
          # reply/chunk/terminal send. These controls exercise a local WebRTC
          # object and are intentionally ignored outside this serialized
          # transport-lab gate.
          run_exact_control revocation_before_the_first_poll_never_reaches_the_embedder --ignored
          run_exact_control revocation_at_the_send_boundary_ends_the_task_with_no_reply --ignored
          run_exact_control v4_r3_core_f3_revocation_at_the_precommit_point_refuses_the_start --ignored
          run_exact_control v4_r3_core_f3_revocation_after_the_start_commit_still_enters_the_closure --ignored

          # Exact realtime flow-handle authority. Its own family because it is
          # about what a *handle* names rather than about session-owned
          # retention, and because both are `#[ignore]`d -- folding them into
          # `v4_macro1_` would make that group select 9 and fail.
          run_exact_group v4_f6_ 2 \
            v4_f6_a_stale_flow_handle_reaches_no_flow_on_the_replacement \
            v4_f6_a_reopened_label_is_a_different_flow_record

          # The drop-close control, which used to be the third member of that
          # family as `v4_f6_dropping_a_flow_handle_leaves_the_flow_open`. It
          # now asserts the opposite -- dropping a handle *closes* the flow --
          # and was renamed into the `f8` series along with the behaviour, so
          # the family above selects two.
          #
          # Run as an exact control rather than as a `v4_f8_` group because that
          # prefix is not unique: `transport/webrtc.rs` holds four more
          # `v4_f8_` callback-ceiling controls. None of them carries
          # `#[ignore]`, so `--ignored` would exclude them and a prefix group
          # would select 1 today -- but naming the full control is exact
          # whether or not one of them ever gains one.
          run_exact_control v4_f8_dropping_a_flow_handle_closes_the_flow --ignored

          # The wire half of the reliable acceptance rule: a delivery the
          # Application Gateway refuses is acknowledged to nobody. The
          # `v4_macro1_` group above is about what a session *retains*; this is
          # about what leaves, so it is named outside that family — and folding
          # it in would make the group select 8 and fail.
          run_exact_control v4_f15_a_refused_reliable_delivery_acknowledges_nothing --ignored

      - name: Reviews 4920920317 and 4923134324 daemon controls
        run: |
          set -euo pipefail

          # Compile a daemon test module once, then require every review control
          # to report `ok` under its exact name. The module may also contain
          # adjacent controls, so its grand total is deliberately not frozen;
          # the exact-name lines are the rename/delete contract.
          run_named_set() {
            selector="$1"
            shift
            log="$(mktemp)"
            cargo test -p myownmesh --lib "$selector" -- --test-threads=1 | tee "$log"
            grep -qE '^running [1-9][0-9]* tests$' "$log" || {
              echo "non-vacuity failure: '$selector' selected no tests" >&2
              exit 1
            }
            for name in "$@"; do
              grep -qE "^test ([^[:space:]]*::)?${name} \.\.\. ok\$" "$log" || {
                echo "non-vacuity failure: '$name' did not report ok under that exact name" >&2
                exit 1
              }
            done
            grep -qE '^test result: ok\. [1-9][0-9]* passed; 0 failed; 0 ignored' "$log" || {
              echo "non-vacuity failure: '$selector' was not wholly passing and ordinary" >&2
              exit 1
            }
          }

          run_exact_daemon_control() {
            name="$1"
            shift
            log="$(mktemp)"
            cargo test -p myownmesh --lib "$name" -- --test-threads=1 "$@" | tee "$log"
            grep -qx 'running 1 test' "$log" || {
              echo "non-vacuity failure: '$name' did not select exactly one test" >&2
              exit 1
            }
            grep -qE "^test ([^[:space:]]*::)?${name} \.\.\. ok\$" "$log" || {
              echo "non-vacuity failure: '$name' did not report ok under that exact name" >&2
              exit 1
            }
            grep -qE '^test result: ok\. 1 passed; 0 failed; 0 ignored' "$log" || {
              echo "non-vacuity failure: '$name' summary was not 1 passed / 0 failed / 0 ignored" >&2
              exit 1
            }
          }

          # Review 4923134324: accepted connection tasks stay in an exactly
          # funded list until their JoinHandles have actually been awaited.
          # The second control fixes the completion/finalization edge so a
          # quiet listener cannot retain a finished task forever.
          run_named_set control::accepted_task_tests:: \
            v4_r2_daemon_a_finished_connection_task_is_joined_rather_than_discarded \
            v4_r2_daemon_a_completion_reaps_its_node_even_before_the_handle_is_finalized

          # Runtime closure reaches quiet streams and writes already parked at
          # an exact AsyncWrite boundary. The fairness control keeps both event
          # sources ready and pins their deterministic alternation; the blocked
          # writer owns its readiness rather than inferring it from capacity.
          run_named_set control::stream_cancellation_tests:: \
            v4_r2_daemon_a_ready_client_mailbox_cannot_starve_a_mesh_event \
            v4_r2_daemon_a_quiet_trace_stream_ends_when_the_runtime_closes \
            v4_r2_daemon_a_blocked_write_still_ends_when_the_runtime_closes

          # Review 4923134324: every daemon cleanup collection owns one funded
          # allocation per element. Splitting moves those funded nodes rather
          # than copying them into an unfunded snapshot.
          run_named_set ipc::leased::tests:: \
            v4_r2_daemon_every_removal_holds_a_node_lease_until_its_node_is_gone \
            v4_r2_daemon_a_split_moves_matching_nodes_without_touching_the_others

          # Framing admission and decoded-request transfer. Running the module
          # once avoids repeated compile/link cycles while each exact name
          # remains independently load-bearing.
          run_named_set control::framing::tests:: \
            an_admitted_line_carries_its_own_storage_past_its_reader \
            a_funded_connection_reader_is_built_once \
            a_refused_connection_reader_is_never_built \
            provider_pressure_refuses_a_line_before_its_buffer_grows \
            structural_parse_pressure_refuses_before_the_request_is_allocated \
            the_reader_refuses_a_chunk_before_reserving_room_for_it \
            a_malformed_line_is_reported_as_malformed_and_not_as_pressure \
            the_decoded_request_carries_its_own_funding_past_the_line \
            v4_r2_daemon_a_padded_decode_releases_its_parse_work_and_keeps_its_retention \
            v4_r2_daemon_encoded_output_pressure_builds_no_buffer_and_returns_to_baseline \
            inbound_realtime_encoding_constructs_exactly_one_output_buffer \
            v4_r2_daemon_prepared_reply_pressure_invokes_no_typed_builder \
            network_id_pressure_precedes_generation_and_the_exact_line_build \
            status_pressure_invokes_no_snapshot_builder_and_the_full_grant_builds_once \
            v4_r3_daemon_networks_pressure_precedes_snapshot_build_and_exact_line \
            v4_r3_daemon_peers_pressure_precedes_commit_and_exact_wrapper_copy

          # Daemon registry accounting, exact channel-route ownership, atomic
          # method registration and the terminal lifecycle.
          run_named_set ipc::clients::tests:: \
            a_longer_coordinate_costs_strictly_more_to_retain \
            an_unrepresentable_coordinate_is_refused_rather_than_truncated \
            a_long_coordinate_is_refused_where_a_short_one_is_admitted \
            a_pending_calls_funding_outlives_its_record_and_ends_with_its_ticket \
            v4_f2_daemon_only_the_first_subscriber_owns_the_install \
            v4_f2_daemon_a_failed_install_unwinds_every_member \
            v4_f2_daemon_a_stale_installer_cannot_touch_the_route_that_replaced_it \
            v4_f2_daemon_the_last_unsubscribe_retires_the_route \
            v4_f3_daemon_a_stale_closure_cannot_route_to_the_client_that_displaced_it \
            v4_f3_daemon_a_refused_claim_leaves_the_incumbent_generation_and_class_exact \
            a_registration_that_reaches_the_commit_after_closing_is_refused \
            a_closing_registry_admits_no_new_work_on_any_path \
            only_the_first_caller_owns_the_drain \
            the_task_join_resolves_only_once_the_last_task_is_gone \
            a_task_ending_during_the_wait_still_wakes_it \
            closed_is_never_published_early \
            the_closing_signal_resolves_for_a_task_that_arrives_after_it \
            v4_r2_daemon_a_pending_call_cannot_be_filed_in_a_class_it_was_not_funded_for \
            v4_r2_daemon_pending_ipc_pressure_refuses_before_the_call_is_built \
            v4_r2_daemon_a_fanout_cursor_skips_removed_members_and_never_repeats_one \
            v4_r2_daemon_a_replaced_route_answers_gone_to_its_predecessors_pump \
            every_never_reused_daemon_identity_refuses_exhaustion \
            a_resubscription_cannot_inherit_an_in_flight_frame \
            pending_identity_exhaustion_refuses_before_the_effect_builder_runs

          # The bridge control crosses the real core PreparedRegistration /
          # OwnedMethodRegistration seam, so keep it as its own exact gate
          # rather than letting the registry-module run stand in for it.
          run_exact_daemon_control v4_f3_daemon_an_in_flight_call_cannot_follow_the_method_to_its_new_owner

          # The borrowed frame measurement and the constructed mailbox item
          # must agree byte-for-byte and claim-for-claim.
          run_exact_daemon_control v4_r2_daemon_a_measured_inbound_frame_matches_the_frame_it_becomes
          run_exact_daemon_control v4_r2_daemon_a_displacement_frame_is_measured_before_its_id_string_exists

          # A coherent borrowed services snapshot must price both populated and
          # absent listener forms before building its funded owner.
          run_exact_daemon_control services_status_measurement_matches_built_multidigit_folded_projection
          run_exact_daemon_control v4_r3_daemon_the_networks_work_ceiling_covers_every_fixed_field
          run_exact_daemon_control v4_r3_daemon_networks_drift_refuses_before_overbudget_build_and_rolls_back
          run_exact_daemon_control v4_r3_daemon_the_prepared_network_rows_are_the_legacy_rows_on_the_wire

          # A production channel pump parks after subscriber selection and
          # before building its peer-sized frame; registry mutations must still
          # complete while it is held at that exact boundary.
          run_exact_daemon_control v4_r2_daemon_a_large_channel_frame_does_not_hold_the_registry_while_it_fans_out

          # This control reads the daemon test binary's shared resource ledger,
          # so it is intentionally ignored and selected alone on Ubuntu.
          run_exact_daemon_control \
            v4_r2_daemon_a_padded_events_subscribe_holds_no_parse_capacity_once_live \
            --ignored

          # Ordinary terminal case: a subscribed client keeps its socket open,
          # Closing ends and joins the task, and the registry reaches Closed
          # with no residue.
          run_exact_daemon_control v4_r2_daemon_a_live_events_subscriber_ends_with_the_runtime

          # Embedded shutdown retains and awaits the real control listener and
          # a live EventsSubscribe connection before services are torn down.
          run_exact_daemon_control v4_r2_daemon_embedded_shutdown_waits_for_its_control_surface

          # This production-path control is Unix-only: it binds a real local
          # control socket and pauses EventsSubscribe immediately before its
          # registry commit while shutdown publishes Closing.
          run_exact_daemon_control a_subscribe_barriered_at_its_commit_loses_to_shutdown_and_leaves_nothing

          # The same Ubuntu-only lane owns the real-socket RPC shutdown
          # witness: a filed call is withdrawn while the exact session remains
          # live, before the control task and registry finish closing.
          run_exact_daemon_control v4_r2_daemon_a_parked_rpc_is_withdrawn_before_socket_shutdown_completes

      - name: Arc 04 native endpoint-auth controls (transport-lab only)
        run: |
          set -euo pipefail
          run_exact_control() {
            name="$1"
            shift
            log="$(mktemp)"
            cargo test -p myownmesh-core --lib --features "transport-lab" \
              "$name" -- --test-threads=1 "$@" | tee "$log"
            grep -qx 'running 1 test' "$log" || {
              echo "non-vacuity failure: '$name' selected no test, or more than one" >&2
              exit 1
            }
            grep -qE "^test ([^[:space:]]*::)?${name} \.\.\. ok\$" "$log" || {
              echo "non-vacuity failure: '$name' did not report ok under that exact name" >&2
              exit 1
            }
            grep -qE '^test result: ok\. 1 passed; 0 failed; 0 ignored' "$log" || {
              echo "non-vacuity failure: '$name' summary was not 1 passed / 0 failed / 0 ignored" >&2
              exit 1
            }
          }

          # Endpoint authentication on a real two-connector link: the positive
          # twin runs first, because if the fixture cannot bring a link up at
          # all the refusal below would pass for the wrong reason.
          for control in \
            v4_arc04_observed_fingerprint_promotes_through_the_live_handler \
            v4_arc04_substituted_fingerprint_is_refused_by_the_live_handler
          do
            run_exact_control "$control" --ignored
          done

  # Validate the static-musl appliance daemons actually cross-compile on every
  # PR, not just at release time. Both riscv64 (NanoKVM) and aarch64-musl
  # (NanoKVM-Pro) are the exact `cargo zigbuild` invocations release.yml ships,
  # so a broken .cargo/config.toml, a dependency that won't cross-compile, or the
  # static-musl getrandom link regression is caught here instead of at release.
  # NOTE: this job deliberately has no RUSTFLAGS env, so .cargo/config.toml's
  # per-target rustflags (+crt-static, -u getrandom) apply.
  daemon-cross:
    name: daemon cross-compile / ${{ matrix.target }}
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        target:
          - riscv64gc-unknown-linux-musl
          - aarch64-unknown-linux-musl
    steps:
      - uses: actions/checkout@v4

      # Pin to the same toolchain as rust-toolchain.toml (channel 1.88.0) and the
      # release jobs. `@stable` would add the cross target to the stable
      # toolchain, but cargo honors rust-toolchain.toml's pin and builds with
      # 1.88.0, which would then lack the target ("can't find crate for core").
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          targets: ${{ matrix.target }}

      - name: Cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          key: daemon-cross-${{ matrix.target }}

      - name: Install Zig + cargo-zigbuild
        run: |
          set -e
          python3 -m pip install --upgrade "ziglang==0.13.0"
          printf '#!/usr/bin/env bash\nexec python3 -m ziglang "$@"\n' | sudo tee /usr/local/bin/zig >/dev/null
          sudo chmod +x /usr/local/bin/zig
          zig version
          cargo install cargo-zigbuild --locked

      - name: Cross-build daemon
        run: cargo zigbuild --release --bin myownmesh --target ${{ matrix.target }}
