name: CI

on:
  push:
    branches: [main, "claude/**", "arc/**"]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: check / ${{ matrix.platform.name }}
    runs-on: ${{ matrix.platform.os }}
    # -D warnings is scoped to this job on purpose: setting RUSTFLAGS at the
    # workflow level would override (not merge with) the per-target rustflags in
    # .cargo/config.toml, dropping the appliance cross-builds' +crt-static and
    # -u getrandom guard. The daemon-cross job below must inherit those instead.
    env:
      RUSTFLAGS: "-D warnings"
    strategy:
      fail-fast: false
      matrix:
        platform:
          - { name: linux-x86_64,   os: ubuntu-22.04 }
          - { name: macos-aarch64,  os: macos-14 }
          - { name: windows-x86_64, os: windows-latest }
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cargo cache
        uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests
        run: cargo test --workspace --no-fail-fast

      - name: Arc 03 final desktop compatibility artifact
        run: |
          cargo check -p myownmesh-core --all-targets --features "legacy-v1"
          cargo check -p myownmesh-core --all-targets --features "legacy-media"
          cargo check -p myownmesh-core --all-targets --features "legacy-v1,legacy-media"
          cargo check -p myownmesh --all-targets --features "legacy-v1"
          cargo check -p myownmesh --all-targets --features "legacy-media"
          cargo check -p myownmesh --all-targets --features "legacy-v1,legacy-media"
          cargo test -p myownmesh --features "legacy-v1" v4_arc03h_legacy_v1_daemon_option_is_explicit -- --nocapture
          cargo test -p myownmesh --features "legacy-media" v4_arc03j_legacy_media_daemon_option_is_independent -- --nocapture
          cargo test -p myownmesh --features "legacy-media" v4_arc03h_legacy_media_profile_uses_the_supported_deployment_form -- --nocapture
          cargo test -p myownmesh-core --features "legacy-v1,legacy-media" v4_arc03j -- --nocapture
          cargo test -p myownmesh --features "legacy-v1,legacy-media" v4_arc03j -- --nocapture

  arc03-compatibility:
    name: Arc 03 retained compatibility paths
    runs-on: ubuntu-22.04
    env:
      RUSTFLAGS: "-D warnings"
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          key: arc03-compatibility

      - name: Reject deprecated use from normal V4 source
        run: |
          RUSTFLAGS="-D warnings -D deprecated" cargo check -p myownmesh-core --all-targets
          RUSTFLAGS="-D warnings -D deprecated" cargo check -p myownmesh --all-targets

      - name: Compile and test retained feature paths
        run: |
          cargo test -p myownmesh-core --features "legacy-v1,legacy-media,transport-lab" --no-fail-fast
          cargo test -p myownmesh --features "legacy-v1,legacy-media" --no-fail-fast

      - name: Arc 03 compiler boundary controls
        run: python3 scripts/check-v4-arc03-compiler-boundaries.py

      - name: Arc 03 final native lifecycle, cleanup, restart, and provider controls
        run: |
          set -euo pipefail
          for control in \
            v4_arc03_cancelled_construction_closes_partial_native_peer \
            v4_arc03_cancelled_construction_with_native_close_error_retains_exact_claim \
            v4_arc03_cancelled_delivered_result_closes_native_peer_before_release \
            v4_arc03_construction_runtime_shutdown_is_bounded_and_fail_closed \
            v4_arc03_background_construction_failure_closes_partial_native_peer \
            v4_arc03j_native_local_ice_restart_commits_exact_replacement \
            v4_arc03j_native_local_ice_restart_failure_retires_connector \
            v4_arc03h_close_wins_before_open_promotion \
            v4_arc03h_close_wins_before_legacy_realtime_admission \
            v4_arc03h_data_only_and_generic_realtime_without_provider_allocate_no_codec_tracks \
            v4_arc03g_close_fence_rejects_endpoint_send_realtime_write_and_lane_open \
            v4_arc03f_track_attach_failure_rolls_back_outbound_flow_owner \
            v4_arc03h_legacy_v1_delivers_one_payload_across_two_native_hops \
            v4_arc04_substituted_fingerprint_is_refused_by_the_live_handler
          do
            cargo test -p myownmesh-core \
              --features "legacy-v1,legacy-media,transport-lab" \
              "$control" -- --ignored --nocapture --test-threads=1
          done
          cargo test -p myownmesh-core \
            --features "legacy-v1,legacy-media,transport-lab" \
            v4_arc03h_failed_remove_track_retains_exact_lane_owner_and_blocks_reuse \
            -- --nocapture --test-threads=1

      - name: Direct and TURN endpoint controls
        run: |
          cargo test -p myownmesh-core --lib \
            --features "legacy-v1,legacy-media,transport-lab" \
            loopback_handshake_opens_data_channel \
            -- --nocapture --test-threads=1
          cargo test -p myownmesh-services \
            --test turn_webrtc_endpoint_auth \
            turn_selected_session_authenticates_endpoints_before_bidirectional_data \
            -- --nocapture --test-threads=1

  # Arc 04 endpoint authentication is basal V4 behaviour, so its evidence must
  # not be reachable only through the deprecated compatibility features. This
  # job builds and runs it with `transport-lab` alone: no legacy-v1, no
  # legacy-media. Deleting the LegacyV1 subtree must not delete the proof that
  # the endpoint-auth profile gate, the channel binding, and the promotion fence
  # hold. It also gives the transport-lab-only configuration its own
  # `-D warnings` gate, which no other job provides.
  arc04-endpoint-auth:
    name: Arc 04 basal endpoint authentication
    runs-on: ubuntu-22.04
    env:
      RUSTFLAGS: "-D warnings"
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          key: arc04-endpoint-auth

      - name: Prefetch locked dependencies for the offline boundary harness
        # The boundary harness builds its probes with `--offline`, so every
        # crate it needs must already be in the local registry. `--locked`
        # keeps that population faithful to Cargo.lock: it fails rather than
        # resolving a different graph, so the harness cannot silently probe
        # against dependencies the lockfile does not pin. This step only
        # populates the cache; it does not relax the harness's offline mode.
        run: cargo fetch --locked

      - name: Arc 04 compiler boundary controls
        run: python3 scripts/check-v4-arc04-compiler-boundaries.py

      - name: Arc 04 basal endpoint-auth controls (transport-lab only)
        run: |
          set -euo pipefail
          # `cargo test` exits 0 when a filter matches nothing, so a renamed or
          # deleted control would pass here silently and this whole step would
          # be decorative. Every run is therefore parsed for three facts:
          # exactly one test was selected, that exact name reported ok, and the
          # summary is one passed with nothing failed and nothing ignored.
          #
          # `--nocapture` is deliberately not used: it interleaves test stdout
          # into the `test <name> ... ok` line, which would make that parse
          # unreliable. The Arc 03 native step keeps --nocapture for its
          # human-readable evidence; this step is the machine-checked one.
          run_exact_control() {
            name="$1"
            shift
            log="$(mktemp)"
            cargo test -p myownmesh-core --lib --features "transport-lab" \
              "$name" -- --test-threads=1 "$@" | tee "$log"
            grep -qx 'running 1 test' "$log" || {
              echo "non-vacuity failure: '$name' selected no test, or more than one" >&2
              exit 1
            }
            grep -qE "^test .*${name} \.\.\. ok\$" "$log" || {
              echo "non-vacuity failure: '$name' did not report ok under that exact name" >&2
              exit 1
            }
            grep -qE '^test result: ok\. 1 passed; 0 failed; 0 ignored' "$log" || {
              echo "non-vacuity failure: '$name' summary was not 1 passed / 0 failed / 0 ignored" >&2
              exit 1
            }
          }

          for control in \
            v4_arc04c_profile_negotiation_refuses_an_unadvertised_peer \
            v4_arc04c_hello_without_the_profile_is_refused_before_any_proof_work \
            v4_arc04c_auth_response_for_another_context_is_refused_before_promotion \
            v4_arc04b_record_carries_the_connector_stated_binding_context \
            v4_arc04b_binding_requires_both_components_and_names_its_profile \
            v4_arc04b_connector_incarnation_is_exact_identity_only \
            v4_arc04c_inbound_media_without_capability_delivers_zero_units \
            v4_arc04c_legacy_policy_alone_delivers_zero_media_units \
            v4_arc04c_capability_without_legacy_policy_delivers_zero_media_units \
            v4_arc04c_capability_plus_policy_delivers_exactly_one_media_unit \
            v4_arc04c_pre_auth_unit_is_not_released_by_later_authentication \
            v4_arc04c_replacement_before_admission_commit_delivers_nothing_through_the_replacement
          do
            run_exact_control "$control"
          done

          # Arc 04 E1: the inbound application path under the admission fence.
          # The defect these pin was an `Option<bool>` that outlived the fence
          # that produced it, after which the affected peer-directed dispatch
          # arms re-resolved the peer by device id — so a replacement installed
          # during the await could receive those peer-scoped effects, counters,
          # and deliveries. Durable identity-keyed governance is intentionally
          # outside the witness and is not what these controls cover. Each
          # control names one consequence, because a single "replacement gets
          # nothing" assertion passes when the frame reaches nobody at all.
          for control in \
            v4_arc04e1_admitted_inbound_effect_lands_on_the_captured_installation \
            v4_arc04e1_captured_peer_effect_is_refused_after_replacement \
            v4_arc04e1_inbound_application_effect_never_reaches_a_replacement \
            v4_arc04e1_inbound_delivery_is_never_attributed_to_a_replacement \
            v4_arc04e1_stale_owner_application_frame_credits_the_replacement_nothing \
            v4_arc04e1_reliable_stream_state_moves_only_under_the_fence
          do
            run_exact_control "$control"
          done

          # Arc 04 E2: regressions that were previously non-deterministic or
          # asserted a stale expectation. Each replaced a case that could pass
          # for the wrong reason — a truncation whose typed cause varied by
          # draw, a feature vector written before the profile became mandatory,
          # and a post-refusal claim assertion that raced the dedicated cleanup
          # thread. They are named here so a silent regression to the flaky
          # form fails the gate rather than the nightly.
          for control in \
            v4_arc04_peer_contribution_rejects_short_and_noncanonical_wire_values \
            v4_arc04b_duplicate_hello_replies_without_adopting_its_metadata \
            v4_arc04_refused_remote_half_is_terminal_and_drives_exactly_one_native_close
          do
            run_exact_control "$control"
          done

          # Arc 04 E4: first-cause terminal semantics. A refused attempt must
          # keep the error that actually refused it; ordinary teardown reaches
          # the same terminal path, so without these the recorded cause of a
          # conflict would depend on scheduling.
          for control in \
            v4_arc04e_a_conflict_keeps_its_cause_through_later_retirement \
            v4_arc04e_later_frames_on_a_conflicted_task_report_the_conflict
          do
            run_exact_control "$control"
          done

          # Arc 04 F1: one locked lifecycle transition. `terminalize` is the
          # sole writer of both the terminal state and the retired cache, and
          # it runs with the exchange guard in hand, so a task can never report
          # itself retired while an operation already inside the critical
          # section is still free to sign or to move the handoff out. The
          # racing pairs are ordered positive-first: the two controls where the
          # operation wins the race and commits run before the two where
          # retirement wins and refuses, so "refused" is measured against a
          # path that demonstrably commits.
          for control in \
            v4_arc04f_every_task_owned_terminal_cause_agrees_on_the_lifecycle \
            v4_arc04f_a_hello_holding_the_lock_commits_before_retirement_lands \
            v4_arc04f_promotion_holding_the_lock_issues_a_capability_retirement_cannot_install \
            v4_arc04f_retirement_holding_the_lock_refuses_the_signature \
            v4_arc04f_retirement_holding_the_lock_refuses_the_handoff_move \
            v4_arc04f_a_premature_proof_is_terminal_not_merely_refused
          do
            run_exact_control "$control"
          done

          # Arc 04 F2: a request id is a routing key, never an authority. Each
          # pending operation additionally names the one canonical device that
          # may settle it and the one response class it accepts. The positive
          # runs first and is load-bearing: it is the legitimate settle — the
          # same device returning over a freshly authenticated replacement
          # connector — so without it every refusal below would pass just as
          # well if nothing could ever settle at all.
          for control in \
            v4_arc04f2_the_same_device_over_a_replacement_connector_completes_the_call \
            v4_arc04f2_a_foreign_peer_cannot_settle_another_peers_pending_call \
            v4_arc04f2_a_replacement_connector_for_a_different_device_still_never_settles \
            v4_arc04f2_a_stream_chunk_from_a_foreign_device_is_ignored \
            v4_arc04f2_a_single_response_cannot_settle_a_pending_stream \
            v4_arc04f2_a_stream_end_cannot_settle_a_pending_single_call \
            v4_arc04f2_request_id_collision_never_displaces_the_existing_pending_owner \
            v4_arc04f2_a_colliding_draw_does_not_rebind_the_incumbents_device
          do
            run_exact_control "$control"
          done

          # Arc 04 G1: a local withdrawal names one entry, not a class of
          # them. F2 above bound the *inbound* settle to a device and a
          # response class; those two coordinates describe a class of
          # operations, and a caller abandoning its own failed send needs to
          # reach exactly one. Matching on the binding meant a stale
          # abandonment — one whose own entry had already been settled by a
          # response that raced the failing send — removed whatever now held
          # the recycled id, if that newcomer was to the same device in the
          # same class. The withdrawal is now conditional on a private
          # process-local identity instead.
          #
          # The positive runs first and is load-bearing in the strongest
          # sense available here: an identity predicate that matched nothing
          # at all would satisfy the negative below perfectly, and would also
          # leave every failed call pending forever. Only the positive rules
          # that out.
          for control in \
            v4_arc04g1_abandonment_withdraws_the_operation_that_filed_it \
            v4_arc04g1_a_stale_abandonment_never_removes_the_reinstalled_owner_of_a_recycled_id
          do
            run_exact_control "$control"
          done

          # Arc 04 G2: a second promotion is a typed non-error outcome, not a
          # borrowed terminal cause. It used to be reported as
          # `ChannelNotCurrent`, which made a live, intact, still-promoted
          # task claim a terminal cause it never took and forced the engine to
          # re-derive "benign duplicate" from its own state.
          #
          # Ordered so that each later control is measured against a path that
          # demonstrably works. The first two are the positives: the task
          # answers a second promotion without terminalizing anything, and the
          # engine really does absorb a corroborated duplicate rather than
          # dropping. `v4_arc04_duplicate_auth_response_after_promotion_is_idempotent`
          # is a pre-existing control, named here for the first time because
          # the fail-closed control below needs it: without a case where this
          # handler does *not* drop, "already promoted with nothing installed
          # drops" passes just as well for a handler that drops every
          # duplicate it ever sees. The third holds `ChannelNotCurrent` to its
          # reserved meaning — driving the same proof bytes at the same task,
          # so the split cannot be an artefact of the frame — and the fourth
          # is the fail-closed half: `AlreadyPromoted` states a lifecycle fact
          # and neither that the replayed signature verified nor that the
          # capability was installed, so an uncorroborated one drops the peer.
          for control in \
            v4_arc04g_second_promotion_is_benign_and_leaves_the_attempt_promoted \
            v4_arc04_duplicate_auth_response_after_promotion_is_idempotent \
            v4_arc04g_a_currentness_refusal_is_terminal_where_a_duplicate_is_not \
            v4_arc04g_already_promoted_without_an_installed_channel_drops
          do
            run_exact_control "$control"
          done

      - name: Arc 04 native endpoint-auth controls (transport-lab only)
        run: |
          set -euo pipefail
          run_exact_control() {
            name="$1"
            shift
            log="$(mktemp)"
            cargo test -p myownmesh-core --lib --features "transport-lab" \
              "$name" -- --test-threads=1 "$@" | tee "$log"
            grep -qx 'running 1 test' "$log" || {
              echo "non-vacuity failure: '$name' selected no test, or more than one" >&2
              exit 1
            }
            grep -qE "^test .*${name} \.\.\. ok\$" "$log" || {
              echo "non-vacuity failure: '$name' did not report ok under that exact name" >&2
              exit 1
            }
            grep -qE '^test result: ok\. 1 passed; 0 failed; 0 ignored' "$log" || {
              echo "non-vacuity failure: '$name' summary was not 1 passed / 0 failed / 0 ignored" >&2
              exit 1
            }
          }

          # Live two-connector controls. The positive twin runs first: if the
          # fixture cannot bring a real link up at all, every negative below
          # would pass for the wrong reason.
          for control in \
            v4_arc04_observed_fingerprint_promotes_through_the_live_handler \
            v4_arc04_substituted_fingerprint_is_refused_by_the_live_handler \
            v4_arc04d_missing_local_fingerprint_is_fail_closed_on_a_live_link \
            v4_arc04d_missing_remote_fingerprint_is_fail_closed_on_a_live_link \
            v4_arc04d_unadvertised_profile_is_refused_by_the_live_handler \
            v4_arc04c_send_uses_the_captured_session_and_records_only_the_captured_peer \
            v4_arc04c_connector_replacement_blocks_later_media_from_the_old_incarnation
          do
            run_exact_control "$control" --ignored
          done

          # Arc 04 E3: the real missing-binding path, driven through the
          # production open path on a live link rather than through a
          # hand-built context. The positive twin runs first for the same
          # reason as the block above: if stated components cannot open and
          # start a handshake at all, "absent component fails closed" passes
          # for the wrong reason.
          for control in \
            v4_arc04e_stated_binding_components_open_and_start_the_handshake \
            v4_arc04e_absent_local_binding_component_fails_the_open_path_closed \
            v4_arc04e_absent_remote_binding_component_fails_the_open_path_closed \
            v4_arc04f3_refused_open_retains_its_claim_when_the_native_close_fails
          do
            run_exact_control "$control" --ignored
          done

  # Validate the static-musl appliance daemons actually cross-compile on every
  # PR, not just at release time. Both riscv64 (NanoKVM) and aarch64-musl
  # (NanoKVM-Pro) are the exact `cargo zigbuild` invocations release.yml ships,
  # so a broken .cargo/config.toml, a dependency that won't cross-compile, or the
  # static-musl getrandom link regression is caught here instead of at release.
  # NOTE: this job deliberately has no RUSTFLAGS env, so .cargo/config.toml's
  # per-target rustflags (+crt-static, -u getrandom) apply.
  daemon-cross:
    name: daemon cross-compile / ${{ matrix.target }}
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        target:
          - riscv64gc-unknown-linux-musl
          - aarch64-unknown-linux-musl
    steps:
      - uses: actions/checkout@v4

      # Pin to the same toolchain as rust-toolchain.toml (channel 1.88.0) and the
      # release jobs. `@stable` would add the cross target to the stable
      # toolchain, but cargo honors rust-toolchain.toml's pin and builds with
      # 1.88.0, which would then lack the target ("can't find crate for core").
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          targets: ${{ matrix.target }}

      - name: Cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          key: daemon-cross-${{ matrix.target }}

      - name: Install Zig + cargo-zigbuild
        run: |
          set -e
          python3 -m pip install --upgrade "ziglang==0.13.0"
          printf '#!/usr/bin/env bash\nexec python3 -m ziglang "$@"\n' | sudo tee /usr/local/bin/zig >/dev/null
          sudo chmod +x /usr/local/bin/zig
          zig version
          cargo install cargo-zigbuild --locked

      - name: Cross-build daemon
        run: cargo zigbuild --release --bin myownmesh --target ${{ matrix.target }}
