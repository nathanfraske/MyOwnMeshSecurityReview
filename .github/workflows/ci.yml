name: CI

on:
  push:
    branches: [main, "claude/**", "arc/**"]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: check / ${{ matrix.platform.name }}
    runs-on: ${{ matrix.platform.os }}
    # -D warnings is scoped to this job on purpose: setting RUSTFLAGS at the
    # workflow level would override (not merge with) the per-target rustflags in
    # .cargo/config.toml, dropping the appliance cross-builds' +crt-static and
    # -u getrandom guard. The daemon-cross job below must inherit those instead.
    env:
      RUSTFLAGS: "-D warnings"
    strategy:
      fail-fast: false
      matrix:
        platform:
          - { name: linux-x86_64,   os: ubuntu-22.04 }
          - { name: macos-aarch64,  os: macos-14 }
          - { name: windows-x86_64, os: windows-latest }
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cargo cache
        uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests
        run: cargo test --workspace --no-fail-fast

      # `--workspace` above runs default features only, so the transport-lab
      # controls never compile there. One suite-wide run with the lab feature
      # covers them. `transport-lab` is now the only optional feature in the
      # workspace, so this is the whole non-default surface.
      - name: Suite-wide transport-lab tests
        run: cargo test -p myownmesh-core --features "transport-lab" --no-fail-fast

  boundaries-and-native:
    name: Compile-fail boundaries and native connector controls
    runs-on: ubuntu-22.04
    env:
      RUSTFLAGS: "-D warnings"
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          key: boundaries-and-native

      - name: Prefetch locked dependencies for the offline boundary harnesses
        run: cargo fetch --locked

      - name: Reject deprecated use from normal V4 source
        run: |
          RUSTFLAGS="-D warnings -D deprecated" cargo check -p myownmesh-core --all-targets
          RUSTFLAGS="-D warnings -D deprecated" cargo check -p myownmesh --all-targets

      # Both compile-fail probe harnesses, side by side. These are what carry
      # the negative boundary claims: each probe is an external crate that must
      # fail to compile for the exact stated cause. Rust visibility, private
      # constructors, and ordinary type checking carry the rest.
      - name: Compiler boundary controls
        run: |
          python3 scripts/check-v4-arc03-compiler-boundaries.py
          python3 scripts/check-v4-arc04-compiler-boundaries.py

      # A representative native set, not a census: connector cleanup ownership,
      # endpoint-driven replacement, and the close fence. These open real peer
      # connections and are `#[ignore]`d, so the suite-wide run in `check` does
      # not reach them; the rest of the connector suite does run there.
      - name: Native connector lifecycle controls
        run: |
          set -euo pipefail
          # Same non-vacuity parse as the Arc 04 steps below, for the same
          # reason: `cargo test` exits 0 when a filter matches nothing, so a
          # renamed or deleted control would pass here silently and naming it
          # would buy nothing. Each run must show exactly one test selected,
          # that exact name reporting ok, and a 1 passed / 0 failed / 0 ignored
          # summary.
          #
          # The tradeoff: this step used to pass `--nocapture` for readable
          # native-connector output. `--nocapture` interleaves test stdout with
          # the `test <name> ... ok` line, so that line can no longer be matched
          # reliably -- and these controls are chatty. A parse that can be
          # defeated by the output it reads is worth less than the log, so the
          # parse wins and a failing control is diagnosed by re-running it
          # locally. `--lib` keeps the run to one target so "running 1 test"
          # means one test, not one of several per-target blocks.
          run_exact_control() {
            name="$1"
            shift
            log="$(mktemp)"
            cargo test -p myownmesh-core --lib --features "transport-lab" \
              "$name" -- --test-threads=1 "$@" | tee "$log"
            grep -qx 'running 1 test' "$log" || {
              echo "non-vacuity failure: '$name' selected no test, or more than one" >&2
              exit 1
            }
            grep -qE "^test .*${name} \.\.\. ok\$" "$log" || {
              echo "non-vacuity failure: '$name' did not report ok under that exact name" >&2
              exit 1
            }
            grep -qE '^test result: ok\. 1 passed; 0 failed; 0 ignored' "$log" || {
              echo "non-vacuity failure: '$name' summary was not 1 passed / 0 failed / 0 ignored" >&2
              exit 1
            }
          }

          for control in \
            v4_arc03_cancelled_construction_closes_partial_native_peer \
            v4_arc03j_native_local_ice_restart_commits_exact_replacement \
            v4_arc03g_close_fence_rejects_endpoint_send \
            v4_arc03_realtime_unit_requires_a_live_session_binding_table
          do
            run_exact_control "$control" --ignored
          done

      - name: Direct and TURN endpoint controls
        run: |
          set -euo pipefail
          # Parsed for non-vacuity like the steps above, and for the same
          # reason: `cargo test` exits 0 when a filter matches nothing, so a
          # renamed or deleted control would pass here silently.
          #
          # These two name the same behaviour over two ICE paths -- a direct
          # in-process handshake and one that a real TURN server relayed -- so
          # they live in different packages and target shapes. The helper
          # therefore takes the selector arguments from the caller and keeps
          # only what must not vary: the filter is the control's exact name,
          # the harness runs single-threaded, and the three assertions are
          # fixed. Neither control is `#[ignore]`d, so neither is selected with
          # `--ignored` and `0 ignored` is a real assertion rather than an
          # artefact of the flag.
          #
          # `--nocapture` is dropped here as elsewhere: it interleaves test
          # stdout into the `test <name> ... ok` line these assertions match,
          # and the TURN control in particular prints timing lines under
          # MYOWNMESH_ARC03_OBSERVE_RAW. Reliable parsing is worth more than CI
          # log detail; re-run locally with `--nocapture` to diagnose.
          run_exact_control() {
            name="$1"
            shift
            log="$(mktemp)"
            cargo test "$@" "$name" -- --test-threads=1 | tee "$log"
            grep -qx 'running 1 test' "$log" || {
              echo "non-vacuity failure: '$name' selected no test, or more than one" >&2
              exit 1
            }
            grep -qE "^test .*${name} \.\.\. ok\$" "$log" || {
              echo "non-vacuity failure: '$name' did not report ok under that exact name" >&2
              exit 1
            }
            grep -qE '^test result: ok\. 1 passed; 0 failed; 0 ignored' "$log" || {
              echo "non-vacuity failure: '$name' summary was not 1 passed / 0 failed / 0 ignored" >&2
              exit 1
            }
          }

          run_exact_control loopback_handshake_opens_data_channel \
            -p myownmesh-core --lib --features "transport-lab"
          run_exact_control turn_selected_session_authenticates_endpoints_before_bidirectional_data \
            -p myownmesh-services --test turn_webrtc_endpoint_auth

  # Endpoint authentication is basal V4 behaviour, so a small representative set
  # of its controls is named explicitly and parsed for non-vacuity: a control
  # that is renamed or deleted fails here rather than passing silently, which a
  # suite-wide run cannot catch. The behavioural coverage itself lives in the
  # suite-wide runs in `check`.
  arc04-endpoint-auth:
    name: Arc 04 basal endpoint authentication
    runs-on: ubuntu-22.04
    env:
      RUSTFLAGS: "-D warnings"
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          key: arc04-endpoint-auth

      - name: Prefetch locked dependencies for the offline boundary harness
        # The boundary harness builds its probes with `--offline`, so every
        # crate it needs must already be in the local registry. `--locked`
        # keeps that population faithful to Cargo.lock: it fails rather than
        # resolving a different graph, so the harness cannot silently probe
        # against dependencies the lockfile does not pin. This step only
        # populates the cache; it does not relax the harness's offline mode.
        run: cargo fetch --locked

      - name: Arc 04 basal endpoint-auth controls (transport-lab only)
        run: |
          set -euo pipefail
          # `cargo test` exits 0 when a filter matches nothing, so a renamed or
          # deleted control would pass here silently and this whole step would
          # be decorative. Every run is therefore parsed for three facts:
          # exactly one test was selected, that exact name reported ok, and the
          # summary is one passed with nothing failed and nothing ignored.
          #
          # `--nocapture` is deliberately not used: it interleaves test stdout
          # into the `test <name> ... ok` line, which would make that parse
          # unreliable. Every parsed step in this file makes the same trade, so
          # a failing control is diagnosed by re-running it locally with
          # `--nocapture` rather than by reading CI output.
          #
          # The helper is repeated verbatim in each parsed step because every
          # `run:` block is its own shell. Extracting it would mean a script
          # file, and a shared file that drifts is worse than a duplicate that
          # cannot.
          run_exact_control() {
            name="$1"
            shift
            log="$(mktemp)"
            cargo test -p myownmesh-core --lib --features "transport-lab" \
              "$name" -- --test-threads=1 "$@" | tee "$log"
            grep -qx 'running 1 test' "$log" || {
              echo "non-vacuity failure: '$name' selected no test, or more than one" >&2
              exit 1
            }
            grep -qE "^test .*${name} \.\.\. ok\$" "$log" || {
              echo "non-vacuity failure: '$name' did not report ok under that exact name" >&2
              exit 1
            }
            grep -qE '^test result: ok\. 1 passed; 0 failed; 0 ignored' "$log" || {
              echo "non-vacuity failure: '$name' summary was not 1 passed / 0 failed / 0 ignored" >&2
              exit 1
            }
          }

          # The named controls carry two different weights. For the ordinary
          # ones the suite-wide transport-lab run in `check` already executes
          # them, so naming them here adds only the rename-or-delete catch a
          # suite-wide run passes silently. For the `#[ignore]`d ones -- which
          # is nearly all of them -- this step is also the run: the suite-wide
          # job never reaches them at all, so deleting a name here deletes its
          # execution.
          #
          # Session admission on a real connector: an admitted peer delivers
          # exactly one accounted unit, and a realtime open without both the
          # capability and the policy is refused. The positive runs first, so
          # the refusal cannot pass merely because the fixture never delivers
          # anything at all. Both open a local WebRTC object and are therefore
          # `#[ignore]`d, which is why they are selected with `--ignored`.
          for control in \
            v4_arc04c_admitted_peer_delivers_exactly_one_accounted_unit \
            v4_arc04c_realtime_without_capability_or_policy_is_refused
          do
            run_exact_control "$control" --ignored
          done

          # The realtime close that returns the connected claim. It opens no
          # native object, so it is the one control in this step that runs in
          # the ordinary set. The captured-peer replacement control used to sit
          # beside it and has moved into the `e1` group below: its arrangement
          # now installs two real connectors, so it carries `#[ignore]` like its
          # siblings and would select nothing here. It is named in exactly one
          # place, so it executes once.
          run_exact_control v4_arc04_promoted_capability_retains_the_connected_claim_until_native_close

          # ---- Promoted-session controls, executed as groups -----------------
          #
          # Fourteen controls, four cargo invocations. Naming each one
          # separately would be fourteen compiles-and-links of the same test
          # binary for no extra guarantee, and the controlling review asked
          # specifically not to grow dozens of one-test invocations. Two of
          # them share no prefix with anything and stay singletons; the other
          # twelve fall into two families that can be selected by prefix and
          # then checked name by name.
          #
          # The group assertion is the same claim as the singleton one, made
          # once per family: the run selected exactly the expected number of
          # tests, every expected name reported ok, and the summary is all
          # passed with nothing failed or ignored. Asserting the count *and*
          # each name matters in both directions -- the count catches a control
          # added to the family without being listed here, and the names catch
          # one renamed out of it.
          run_exact_group() {
            prefix="$1"
            expected="$2"
            shift 2
            log="$(mktemp)"
            cargo test -p myownmesh-core --lib --features "transport-lab" \
              "$prefix" -- --test-threads=1 --ignored | tee "$log"
            grep -qx "running $expected tests" "$log" || {
              echo "non-vacuity failure: '$prefix' did not select exactly $expected tests" >&2
              exit 1
            }
            for name in "$@"; do
              grep -qE "^test .*${name} \.\.\. ok\$" "$log" || {
                echo "non-vacuity failure: '$name' did not report ok under that exact name" >&2
                exit 1
              }
            done
            grep -qE "^test result: ok\. $expected passed; 0 failed; 0 ignored" "$log" || {
              echo "non-vacuity failure: '$prefix' summary was not $expected passed / 0 failed / 0 ignored" >&2
              exit 1
            }
          }

          # The three that carry no family prefix.
          run_exact_control admission_gate_admits_application_traffic_from_active_peer --ignored
          run_exact_control v4_arc03_outbound_application_send_requires_current_session_admission --ignored

          # Revocation of a *retained* admission. The controls above prove a
          # session is refused when it was never admitted; this one proves an
          # already-promoted session stops authorizing once policy is revoked,
          # and stays refused when policy is restored. It is
          # `#[cfg(feature = "transport-lab")]` and `#[ignore]`d, so neither the
          # default workspace run nor the suite-wide transport-lab run ever
          # reaches it: this line is its only execution anywhere in CI.
          run_exact_control v4_arc05_revoking_policy_refuses_the_next_operation_and_drops_the_session --ignored

          # Inbound application effects against a replaced installation.
          run_exact_group v4_arc04e1_ 6 \
            v4_arc04e1_admitted_inbound_effect_lands_on_the_captured_installation \
            v4_arc04e1_inbound_application_effect_never_reaches_a_replacement \
            v4_arc04e1_captured_peer_effect_is_refused_after_replacement \
            v4_arc04e1_inbound_delivery_is_never_attributed_to_a_replacement \
            v4_arc04e1_stale_owner_application_frame_credits_the_replacement_nothing \
            v4_arc04e1_reliable_stream_state_moves_only_under_the_fence

          # Who may settle a pending call. The last one is the negative that
          # gives the family its point: a replacement connector for a
          # *different* device still never settles.
          #
          # This prefix is not unique to the engine module -- `rpc.rs` has two
          # `v4_arc04f2_` request-id collision controls. They are ordinary
          # tests, so `--ignored` excludes them and the count is 6. If either
          # ever gains `#[ignore]`, this selects 8 and fails here, which is the
          # right way for that to surface.
          run_exact_group v4_arc04f2_ 6 \
            v4_arc04f2_a_foreign_peer_cannot_settle_another_peers_pending_call \
            v4_arc04f2_a_single_response_cannot_settle_a_pending_stream \
            v4_arc04f2_a_stream_end_cannot_settle_a_pending_single_call \
            v4_arc04f2_a_stream_chunk_from_a_foreign_device_is_ignored \
            v4_arc04f2_the_same_device_over_a_replacement_connector_completes_the_call \
            v4_arc04f2_a_replacement_connector_for_a_different_device_still_never_settles

          # Session-owned retention: the reliable frames and the capability
          # advertisement a promoted session holds, and what happens to them
          # when that session ends or its provider refuses.
          #
          # The `v4_macro1_` prefix is heavily shared -- `transport/webrtc.rs`,
          # `provider.rs` and `session_flow.rs` hold about twenty-five more --
          # but all of those are ordinary tests, so `--ignored` excludes them
          # and the count is 3. If any of them ever gains `#[ignore]`, this
          # selects more than 3 and fails here, which is the right way for that
          # to surface.
          #
          # `v4_macro1_reliable_submission_without_a_session_is_refused_and_retains_nothing`
          # is deliberately absent: it carries no `#[ignore]`, so the suite-wide
          # transport-lab run in `check` already executes it, and naming it here
          # would make this group select 4 and fail. It is the negative these
          # three positives are read against.
          run_exact_group v4_macro1_ 3 \
            v4_macro1_ending_a_session_releases_its_retained_frames_and_resolves_their_callers \
            v4_macro1_retention_pressure_refuses_the_next_frame_and_releases_exactly_on_ack \
            v4_macro1_capability_metadata_is_owned_by_the_session_that_receives_it

      - name: Arc 04 native endpoint-auth controls (transport-lab only)
        run: |
          set -euo pipefail
          run_exact_control() {
            name="$1"
            shift
            log="$(mktemp)"
            cargo test -p myownmesh-core --lib --features "transport-lab" \
              "$name" -- --test-threads=1 "$@" | tee "$log"
            grep -qx 'running 1 test' "$log" || {
              echo "non-vacuity failure: '$name' selected no test, or more than one" >&2
              exit 1
            }
            grep -qE "^test .*${name} \.\.\. ok\$" "$log" || {
              echo "non-vacuity failure: '$name' did not report ok under that exact name" >&2
              exit 1
            }
            grep -qE '^test result: ok\. 1 passed; 0 failed; 0 ignored' "$log" || {
              echo "non-vacuity failure: '$name' summary was not 1 passed / 0 failed / 0 ignored" >&2
              exit 1
            }
          }

          # Endpoint authentication on a real two-connector link: the positive
          # twin runs first, because if the fixture cannot bring a link up at
          # all the refusal below would pass for the wrong reason.
          for control in \
            v4_arc04_observed_fingerprint_promotes_through_the_live_handler \
            v4_arc04_substituted_fingerprint_is_refused_by_the_live_handler
          do
            run_exact_control "$control" --ignored
          done

  # Validate the static-musl appliance daemons actually cross-compile on every
  # PR, not just at release time. Both riscv64 (NanoKVM) and aarch64-musl
  # (NanoKVM-Pro) are the exact `cargo zigbuild` invocations release.yml ships,
  # so a broken .cargo/config.toml, a dependency that won't cross-compile, or the
  # static-musl getrandom link regression is caught here instead of at release.
  # NOTE: this job deliberately has no RUSTFLAGS env, so .cargo/config.toml's
  # per-target rustflags (+crt-static, -u getrandom) apply.
  daemon-cross:
    name: daemon cross-compile / ${{ matrix.target }}
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        target:
          - riscv64gc-unknown-linux-musl
          - aarch64-unknown-linux-musl
    steps:
      - uses: actions/checkout@v4

      # Pin to the same toolchain as rust-toolchain.toml (channel 1.88.0) and the
      # release jobs. `@stable` would add the cross target to the stable
      # toolchain, but cargo honors rust-toolchain.toml's pin and builds with
      # 1.88.0, which would then lack the target ("can't find crate for core").
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          targets: ${{ matrix.target }}

      - name: Cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          key: daemon-cross-${{ matrix.target }}

      - name: Install Zig + cargo-zigbuild
        run: |
          set -e
          python3 -m pip install --upgrade "ziglang==0.13.0"
          printf '#!/usr/bin/env bash\nexec python3 -m ziglang "$@"\n' | sudo tee /usr/local/bin/zig >/dev/null
          sudo chmod +x /usr/local/bin/zig
          zig version
          cargo install cargo-zigbuild --locked

      - name: Cross-build daemon
        run: cargo zigbuild --release --bin myownmesh --target ${{ matrix.target }}
